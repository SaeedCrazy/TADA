<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<style>
body{margin:0;background:#666;color:#fff;font:14px sans-serif;padding:24px}
.row{display:flex;gap:24px;align-items:center;margin:14px 0;flex-wrap:wrap}
.tt{stroke:#fff;fill:none;stroke-width:var(--tt-sw);stroke-linecap:butt;stroke-linejoin:miter;overflow:visible}
.tt .tt-f{fill:#fff;stroke:none}
small{opacity:.6;direction:ltr}
img{width:900px;display:block}
</style></head><body>
<img src="ref_tagline.png">
<div id="out"></div>
<script src="../js/letters-data.js"></script>
<script src="../js/letters.js"></script>
<script>
const out = document.getElementById('out');
const lines = [
 ['نـت جادویی طعم', 0.06, 110],
 ['تــادا لانژ', 0.06, 90],
 ['تادا یعنی همان لحظه', 0.06, 70],
 ['هر لیوان یک ترفند', 0.06, 70],
 ['سه شعبه', 0.06, 70],
 ['با تادا کار کنید', 0.06, 70],
 ['ساعت کاری صبح ۹ الی ۱۶ عصر ۱۷ الی ۲۳', 0.06, 48],
 ['سفارش آنلاین از وبسایت', 0.06, 48],
 ['اوبه ماچا قهوه بیکری کوکی', 0.06, 56],
 ['ملاصدرا جمهوری دانشگاه', 0.06, 56],
 ['ا ب پ ت ث ج چ ح خ د ذ ر ز ژ س ش ص ض ط ظ ع غ ف ق ک گ ل م ن و ه ی', 0.06, 40],
 ['ببب ججج سسس ععع ففف ققق ککک گگگ للل ممم ننن ههه ییی ططط', 0.06, 40],
 ['۰۱۲۳۴۵۶۷۸۹ 0123456789', 0.06, 40],
];
for (const [t, w, s] of lines) {
  const r = document.createElement('div'); r.className = 'row';
  r.appendChild(TadaType.svg(t, { weight: w, size: s }));
  const c = document.createElement('small'); c.textContent = t; r.appendChild(c);
  out.appendChild(r);
}
</script></body></html>
