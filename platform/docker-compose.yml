# Tada platform: PostgreSQL, API, web app and nginx. See docs/DEPLOY.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tada
      POSTGRES_USER: tada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tada -d tada"]
      interval: 10s
      retries: 10
    restart: unless-stopped

  api:
    image: tada-api:latest
    build: { context: ., dockerfile: deploy/api.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tada:${POSTGRES_PASSWORD}@db:5432/tada?schema=public
      TRUST_PROXY: "true"
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  web:
    image: tada-web:latest
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_WEB_URL:?set PUBLIC_WEB_URL in .env}
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./deploy/nginx/${NGINX_MODE:-http}.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/common.inc:/etc/nginx/conf.d/common.inc:ro
      - ./deploy/site:/srv/site:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - uploads:/srv/uploads:ro
    depends_on: [web, api]
    restart: unless-stopped

volumes:
  db:
  uploads:
