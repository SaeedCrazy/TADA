<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#3a1650;color:#fff;font:12px sans-serif;display:flex;flex-wrap:wrap;gap:10px;padding:10px}
figure{margin:0;width:230px;height:230px;border:1px solid #6b4a80;display:flex;flex-direction:column;align-items:center;justify-content:center}
svg{max-width:210px;max-height:190px}
.s{fill:none;stroke:#F4EEF7;stroke-linecap:butt;stroke-linejoin:miter}.f{fill:#F4EEF7}
</style></head><body><script src="../js/art-data.js"></script><script>
for (const [n,a] of Object.entries(TADA_ART)) {
  const f = document.createElement('figure');
  const sw = a.vb[2] / 200 * 1.4;
  f.innerHTML = `<svg viewBox="${a.vb.join(' ')}">${a.p.map(([d,k,w]) => k ? `<path class="f" d="${d}"/>` : `<path class="s" stroke-width="${9.85*(w||1)}" d="${d}"/>`).join('')}</svg><figcaption>${n} (${a.p.length})</figcaption>`;
  document.body.appendChild(f);
}
</script></body></html>
