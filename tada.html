:root {
  /* the brand's purples (Tada's own), and the two lights of the day */
  --night: #1C0727;        /* outside the glass after dark */
  --plum: #35084C;         /* Tada night purple */
  --tada: #662482;         /* Tada purple */
  --mauve: #926D8F;
  --lilac: #EFE9F2;        /* the day inside */
  --cream: #F6F0F8;        /* the line at night */
  --haze: #C3ADCF;         /* soft text at night */

  --font: 'Doran', 'Vazirmatn', Tahoma, system-ui, sans-serif;
  --pad: clamp(22px, 5vw, 64px);
  --wide: 1240px;
  --gap: clamp(120px, 17vh, 210px);
  --ink-w: 3px;            /* the travelling line (set to the door's own line weight) */
  --art-w: 2px;            /* the illustrations of the glass */
  --nav-h: 72px;
  --ease: cubic-bezier(.22, .61, .21, 1);
  --sky: clamp(260px, 56vh, 640px);
}
@supports (height: 1svh) { :root { --sky: clamp(260px, 56svh, 640px); } }
@media (max-width: 767px) { :root { --ink-w: 2.2px; --art-w: 1.6px; --nav-h: 60px; } }

[data-surface="night"] { --bg: var(--night); --fg: var(--cream); --soft: var(--haze); --ink: var(--cream); --art: var(--cream); --line-soft: rgba(246, 240, 248, .22); }
[data-surface="day"]   { --bg: var(--lilac); --fg: var(--plum); --soft: rgba(53, 8, 76, .74); --ink: var(--tada); --art: var(--tada); --line-soft: rgba(102, 36, 130, .22); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--night); color-scheme: dark light; }
body {
  margin: 0; font-family: var(--font); font-size: 18px; line-height: 2; font-weight: 400;
  color: var(--cream); background: var(--night);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  overflow-x: hidden;
  overflow-x: clip;
}
html[lang="en"] body { line-height: 1.65; }
@media (max-width: 767px) { body { font-size: 17px; } }
img, svg { display: block; max-width: 100%; }
a { color: inherit; }
p { margin: 0 0 1em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1.5px solid var(--fg, var(--cream)); outline-offset: 5px; border-radius: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip-link { position: fixed; z-index: 100; inset-inline-start: 16px; top: 12px; padding: 10px 16px; background: var(--cream); color: var(--plum); transform: translateY(-160%); transition: transform .3s var(--ease); text-decoration: none; }
.skip-link:focus { transform: none; }

section, footer { position: relative; background: var(--bg); color: var(--fg); isolation: isolate; }
.container { width: 100%; max-width: var(--wide); margin-inline: auto; padding-inline: var(--pad); position: relative; }

/* ---------- type ---------- */
.lead { font-size: clamp(19px, 1.45vw, 22px); font-weight: 340; line-height: 1.95; color: var(--fg); }
html[lang="en"] .lead { line-height: 1.6; }
.body { color: var(--soft); max-width: 36em; }
.small { font-size: 14.5px; line-height: 1.9; }
.soft { color: var(--soft); }
.text { max-width: 33em; }
.text.narrow { max-width: 30em; }

/* headlines: Tada letters in Persian (an svg written by the line), Doran in English */
.tt-h { margin: 0 0 clamp(26px, 3vw, 40px); font-weight: 300; font-size: clamp(34px, 3.8vw, 54px); line-height: 1.15; letter-spacing: -.005em; color: var(--fg); }
.tt-h .tt { height: auto; max-width: 100%; overflow: visible; }
.tt { fill: none; stroke: var(--tt-c, var(--ink)); stroke-width: var(--tt-sw); stroke-linecap: butt; stroke-linejoin: miter; }
.tt .tt-f { fill: var(--tt-c, var(--ink)); stroke: none; }

/* ---------- the art of the glass ---------- */
.art-slot { display: block; position: relative; }
.art { width: 100%; height: auto; overflow: visible; }
.art .s { fill: none; stroke: var(--art); stroke-width: var(--sw, 9.85); stroke-linecap: butt; stroke-linejoin: miter; }
.art .f { fill: var(--art); }
/* before the line reaches a piece, it is not there yet */
.js .art.is-waiting .s { opacity: 0; }
.js .art.is-waiting .f { opacity: 0; }
.js .tt.is-waiting path { opacity: 0; }

/* ---------- buttons: the glass's chamfered panel ---------- */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .55em;
  min-height: 46px; padding: 8px 26px; border: 0; background: none; cursor: pointer;
  font-size: 15.5px; line-height: 1.4; font-weight: 450; color: var(--fg); text-decoration: none; white-space: nowrap;
  transition: color .4s var(--ease);
}
.btn .frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.btn .frame path { fill: transparent; stroke: currentColor; stroke-width: 1.25; transition: fill .45s var(--ease); vector-effect: non-scaling-stroke; }
.btn:hover .frame path, .btn:focus-visible .frame path { fill: var(--line-soft); }
.btn-quiet { min-height: 44px; padding: 6px 12px; font-size: 14.5px; font-weight: 420; }
.btn-quiet .frame { display: none; }
.btn-quiet::after { content: ''; position: absolute; inset-inline: 12px; bottom: 9px; height: 1px; background: currentColor; transform: scaleX(0); transition: transform .45s var(--ease); }
.btn-quiet:hover::after, .btn-quiet:focus-visible::after { transform: scaleX(1); }
.star { display: inline-block; width: .62em; height: .62em; flex: none; background: currentColor;
  -webkit-mask: var(--star-mask) center / contain no-repeat; mask: var(--star-mask) center / contain no-repeat; }

/* ---------- nav ---------- */
.nav {
  position: fixed; z-index: 40; inset: 0 0 auto; height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between; gap: 18px;
  padding-inline: var(--pad); color: var(--cream);
  transition: color .6s var(--ease), background-color .6s var(--ease);
}
.nav[data-ink="day"] { color: var(--plum); }
.nav::before { content: ''; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity .6s var(--ease);
  background: linear-gradient(to bottom, rgba(28, 7, 39, .78), rgba(28, 7, 39, 0)); }
.nav[data-ink="day"]::before { background: linear-gradient(to bottom, rgba(239, 233, 242, .86), rgba(239, 233, 242, 0)); }
.nav.is-scrolled::before { opacity: 1; }
.nav-mark { display: block; width: 32px; height: 46px; flex: none; color: inherit; }
.nav-mark svg { width: 100%; height: 100%; overflow: visible; }
.nav-mark .f { fill: currentColor; }
.nav-links { display: flex; gap: clamp(18px, 2.6vw, 38px); margin-inline-start: auto; }
.nav-links a { position: relative; text-decoration: none; font-size: 15px; font-weight: 420; padding: 10px 0; }
.nav-links a::after { content: ''; position: absolute; inset-inline: 0; bottom: 6px; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: var(--origin, right); transition: transform .5s var(--ease); }
html[dir="ltr"] .nav-links a::after { --origin: left; }
.nav-links a:hover::after, .nav-links a:focus-visible::after, .nav-links a[aria-current="true"]::after { transform: scaleX(1); }
.nav-tools { display: flex; align-items: center; gap: 4px; }
.nav-menu-btn { display: none; }
.lang-toggle { font-family: var(--font); }
@media (max-width: 860px) {
  .nav-links { display: none; }
  .nav-menu-btn { display: inline-flex; }
  .nav .sound-toggle { display: none; }
}

.mmenu { position: fixed; z-index: 60; inset: 0; background: var(--night); color: var(--cream); display: flex; flex-direction: column; padding: 18px var(--pad) 32px; }
.mmenu[hidden] { display: none; }
.mmenu-head { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.mmenu-title { margin: 0; font-size: 15px; color: var(--haze); }
.mmenu-links { display: flex; flex-direction: column; gap: 4px; margin: auto 0; padding: 24px 0; }
.mmenu-links a { font-size: 30px; font-weight: 300; line-height: 1.5; text-decoration: none; padding: 8px 0; }
.mmenu-tools { display: flex; gap: 12px; flex-wrap: wrap; }

/* ---------- hero: the door ---------- */
.hero { min-height: 100vh; min-height: 100svh; padding: calc(var(--nav-h) + 12px) 0 clamp(64px, 12vh, 120px); display: flex; flex-direction: column; justify-content: center; }
.hero-grid {
  width: 100%; max-width: 1360px; margin-inline: auto; padding-inline: var(--pad);
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: clamp(28px, 4vw, 72px);
}
.hero-door { --door-h: min(70vh, 700px); display: flex; flex-direction: column; align-items: center; }
@supports (height: 1svh) { .hero-door { --door-h: min(70svh, 700px); } }
.door { position: relative; height: var(--door-h); aspect-ratio: 1353 / 1728; }
.door > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.door .s { fill: none; stroke: var(--cream); stroke-linecap: butt; stroke-linejoin: miter; }
.door .f { fill: var(--cream); }
.door-film { position: absolute; inset: 1.2% 1.4% 0; overflow: hidden; border-radius: 50% 50% 0 0 / 39% 39% 0 0; opacity: .9; }
.door-film video, .door-film img { width: 100%; height: 100%; object-fit: cover; }
.sill { width: calc(var(--door-h) * 1353 / 1728 * 0.86); margin-top: calc(var(--door-h) * .028); display: grid; gap: calc(var(--door-h) * .018); }
.hero-side { display: flex; flex-direction: column; gap: 28px; }
.hero-words { align-items: flex-start; }
.hero-tagline { margin: 0; font-weight: 300; font-size: clamp(26px, 2.4vw, 36px); line-height: 1.3; }
.hero-tagline .art-slot { width: min(100%, 380px); }
.hero-tagline .en-line { display: none; }
html[lang="en"] .hero-tagline .art-slot { display: none; }
html[lang="en"] .hero-tagline .en-line { display: block; }
.insta-link { display: block; width: min(100%, 300px); padding: 10px 0; opacity: .86; transition: opacity .4s var(--ease); }
.insta-link:hover, .insta-link:focus-visible { opacity: 1; }
.hero-hours { align-items: flex-end; }
html[dir="ltr"] .hero-hours { align-items: flex-end; }
.hours-card { display: grid; gap: 2px; font-size: 17px; line-height: 1.8; }
.hours-card p { margin: 0; }
.hours-title { display: flex; align-items: center; gap: .5em; color: var(--haze); font-size: 15px; margin-bottom: 6px !important; }
.hours-row { font-size: clamp(19px, 1.5vw, 22px); font-weight: 340; }
.status { margin-top: 10px !important; font-size: 14.5px; color: var(--haze); display: flex; align-items: center; gap: .55em; min-height: 1.9em; }
.status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; border: 1px solid currentColor; flex: none; }
.status.is-open::before { background: currentColor; box-shadow: 0 0 10px currentColor; }
.order-link { display: grid; gap: 10px; margin-top: 26px; text-decoration: none; }
.order-label { display: flex; align-items: center; gap: .5em; font-size: 15px; color: var(--haze); }
.order-link .art-slot { width: min(100%, 230px); transition: opacity .4s var(--ease); }
.order-link:hover .art-slot, .order-link:focus-visible .art-slot { opacity: .8; }
.hero-cue { position: absolute; inset-inline: 0; bottom: clamp(18px, 4vh, 36px); margin: 0; text-align: center; font-size: 14px; color: var(--haze); letter-spacing: .01em; opacity: 0; }
.loading { position: absolute; inset: auto 0 0; height: 1px; }

@media (max-width: 1023px) {
  .hero { justify-content: flex-start; padding-top: calc(var(--nav-h) + 24px); }
  .hero-grid { grid-template-columns: 1fr; justify-items: center; gap: 40px; }
  .hero-door { order: -1; --door-h: min(54vh, 96vw, 520px); }
  @supports (height: 1svh) { .hero-door { --door-h: min(54svh, 96vw, 520px); } }
  .hero-words, .hero-hours { align-items: center; text-align: center; }
  .hero-tagline .art-slot { width: min(78vw, 340px); margin-inline: auto; }
  .insta-link { width: min(72vw, 260px); margin-inline: auto; }
  .order-label { justify-content: center; }
  .order-link .art-slot { margin-inline: auto; width: min(52vw, 200px); }
  .hours-title { justify-content: center; }
  .status { justify-content: center; }
  .hero-cue { position: static; margin-top: 44px; }
}

/* ---------- chapters ---------- */
.chapter { padding-block: var(--gap); }
.sky { position: absolute; inset: 0 0 auto; height: var(--sky); z-index: -2; pointer-events: none; }
.sky-dawn { background: linear-gradient(180deg, #1C0727 0%, #22092F 9%, #2F0D41 19%, #43165A 30%, #5C2C73 41%, #7D5590 53%, #A388B3 66%, #C8B7D2 78%, #E2D8E8 90%, #EFE9F2 100%); }
.sky-dusk { background: linear-gradient(180deg, #EFE9F2 0%, #E2D8E8 10%, #C8B7D2 22%, #A388B3 34%, #7D5590 47%, #5C2C73 59%, #43165A 70%, #2F0D41 81%, #22092F 91%, #1C0727 100%); }
.morning, .evening { padding-top: calc(var(--sky) + var(--gap) * .45); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(40px, 7vw, 120px); align-items: center; }
.split > .text { grid-column: 1; grid-row: 1; }
.split > .art-col { grid-column: 2; grid-row: 1; }
.split.mirror > .text { grid-column: 2; }
.split.mirror > .art-col { grid-column: 1; }
.art-col { display: grid; justify-items: center; gap: clamp(28px, 4vw, 56px); padding-inline: clamp(20px, 4vw, 60px); }
.art-sun { width: min(100%, 320px); }
.art-kettle { width: min(100%, 360px); justify-self: end; }
html[dir="ltr"] .art-kettle { justify-self: start; }
.art-path { width: min(100%, 440px); }
.art-espresso { width: min(100%, 400px); }
.art-hat { width: min(100%, 280px); }
@media (max-width: 1023px) {
  .split, .split.mirror { grid-template-columns: 1fr; gap: 64px; }
  .split > .text, .split.mirror > .text, .split > .art-col, .split.mirror > .art-col { grid-column: 1; grid-row: auto; }
  .art-col { padding-inline: 18px; }
  .art-sun { width: min(66vw, 280px); }
  .art-kettle { width: min(76vw, 320px); justify-self: center; }
  .art-path { width: min(82vw, 380px); }
  .art-espresso { width: min(82vw, 360px); }
  .art-hat { width: min(56vw, 230px); }
}

/* the coffee bag */
.pack { margin-top: 44px; padding: 30px clamp(22px, 3vw, 34px) 32px; position: relative; }
.pack > .frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.pack > .frame path { fill: none; stroke: var(--ink); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.pack-title { margin: 0 0 6px; font-size: 14.5px; color: var(--soft); }
.pack-name { margin: 0; font-size: clamp(21px, 1.8vw, 26px); font-weight: 400; line-height: 1.5; }
.pack-size { margin: 0 0 14px; color: var(--soft); font-size: 15px; }
.pack-intro { color: var(--soft); font-size: 16px; }
.specs { display: grid; grid-template-columns: auto 1fr; gap: 4px 22px; margin: 18px 0 22px; font-size: 15.5px; }
.specs dt { color: var(--soft); }
.specs dd { margin: 0; }
.profile { margin: 0 0 8px; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14.5px; }
.profile li { display: grid; grid-template-columns: 5.6em 1fr; align-items: center; gap: 14px; }
.profile .bar { position: relative; height: 1px; background: var(--line-soft); }
.profile .bar i { position: absolute; inset-block: -1px; inset-inline-start: 0; width: calc(var(--v) * 1%); background: var(--ink); }
.profile .bar i::after { content: ''; position: absolute; inset-inline-end: -4px; top: -3px; width: 8px; height: 8px; background: var(--ink);
  -webkit-mask: var(--star-mask) center / contain no-repeat; mask: var(--star-mask) center / contain no-repeat; }
.profile-title { font-size: 14.5px; color: var(--soft); margin: 0 0 10px; }
.profile-note { font-size: 13.5px; color: var(--soft); margin: 10px 0 22px; }

/* ---------- the menu: notes on a staff ---------- */
.menu { padding: 0; }
.menu-inner { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; padding: calc(var(--nav-h) + 8px) 0 28px; }
.menu-head { margin-bottom: clamp(26px, 5vh, 56px); }
.menu-head .tt-h { margin-bottom: 14px; }
.menu-head .lead { max-width: 30em; margin: 0; }
.menu-stage { position: relative; width: 100%; overflow: hidden; padding-block: 20px 0; }
.menu-track { position: relative; margin: 0; padding: 0 calc(50vw - var(--card-w) / 2) 90px; display: flex; gap: var(--card-gap); width: max-content; will-change: transform; }
.menu-track > .ink-track { position: absolute; top: 0; left: 0; z-index: 3; }
.shelf-star { fill: var(--ink); }
.menu { --card-w: min(400px, 76vw); --card-gap: clamp(28px, 6vw, 96px); }
.card { position: relative; width: var(--card-w); padding: 34px 30px 30px; display: grid; grid-template-rows: auto auto 1fr; align-content: start; }
.card > .frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.card > .frame .fr-base { fill: none; stroke: var(--ink); stroke-width: 1.25; vector-effect: non-scaling-stroke; opacity: .32; transition: opacity .9s var(--ease); }
.card.is-front > .frame .fr-base { opacity: .55; }
/* the magic: the frame draws itself bright, and a filled triangle completes each cut corner */
.card > .frame .fr-on { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-dasharray: 1 1; stroke-dashoffset: 1; vector-effect: non-scaling-stroke; }
.card > .frame .fr-tri { fill: var(--ink); }
@media (pointer: fine) { .card > .frame .fr-tri { filter: drop-shadow(0 0 5px rgba(146, 109, 143, .65)); } }
.card { --c: 28px; }
.card-light { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  clip-path: polygon(var(--c) 0, calc(100% - var(--c)) 0, 100% var(--c), 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, var(--c) 100%, 0 calc(100% - var(--c)), 0 var(--c)); }
.card-sheen { position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%; opacity: 0;
  background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, .35) 45%, rgba(255, 255, 255, .6) 50%, rgba(255, 255, 255, .35) 55%, rgba(255, 255, 255, 0) 100%); }
.card-glare { position: absolute; inset: 0; opacity: 0; transition: opacity .6s var(--ease);
  background: radial-gradient(420px circle at var(--gx, 50%) var(--gy, 50%), rgba(255, 255, 255, .42), rgba(255, 255, 255, 0) 60%); }
.card.is-hover .card-glare { opacity: 1; }
.card > *:not(.frame):not(.card-light):not(.card-arrow) { position: relative; }
.card-art { height: clamp(120px, 21vh, 210px); display: grid; place-items: center; margin-bottom: 18px; }
.card-art .art-slot { height: 100%; }
.card-art .art { height: 100%; width: auto; }
.card-name { margin: 0; font-size: 30px; font-weight: 300; line-height: 1.3; min-height: 56px; display: flex; align-items: center; }
.card-name .tt { height: 52px; width: auto; }
html[lang="en"] .card-name .tt { display: none; }
.card-sub { margin: 4px 0 8px; color: var(--soft); font-size: 15px; }
.card-note { margin: 0; font-size: 16.5px; line-height: 1.95; }
/* < and >: faint, on the flavor itself, each at its own edge pointing outward (as before) */
.card-arrow { position: absolute; top: 50%; z-index: 3; width: 44px; height: 64px; margin-top: -32px; padding: 0; border: 0; background: none;
  color: var(--ink); cursor: pointer; opacity: 0; pointer-events: none; transition: opacity .7s var(--ease); }
.card-arrow.is-prev { inset-inline-start: 2px; }
.card-arrow.is-next { inset-inline-end: 2px; }
.card-arrow svg { display: block; width: 22px; height: 22px; margin: auto; overflow: visible; transition: transform .5s var(--ease); }
.card-arrow path { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.card.is-front .card-arrow { opacity: .42; pointer-events: auto; }
.card.is-front .card-arrow:hover, .card.is-front .card-arrow:focus-visible { opacity: .95; }
.card-arrow.is-prev:hover svg { transform: translateX(calc(-3px * var(--dir-x, 1))); }
.card-arrow.is-next:hover svg { transform: translateX(calc(3px * var(--dir-x, 1))); }
[dir="rtl"] .card-arrow { --dir-x: -1; }
.card-arrow:active svg { transform: scale(.86); }
.card-arrow[hidden] { display: none; }
.card-arrow:focus-visible { outline: 1px solid currentColor; outline-offset: -6px; border-radius: 8px; }
.menu-dots { display: flex; justify-content: center; gap: 14px; margin-top: clamp(22px, 4vh, 40px); }
.menu-dots i { width: 9px; height: 9px; background: var(--ink); opacity: .25; transition: opacity .6s var(--ease), transform .6s var(--ease);
  -webkit-mask: var(--star-mask) center / contain no-repeat; mask: var(--star-mask) center / contain no-repeat; }
.menu-dots i.is-on { opacity: 1; transform: scale(1.5); }
@media (max-width: 767px) {
  .card { padding: 26px 22px 24px; --c: 20px; }
  .card-art { height: clamp(100px, 18vh, 150px); }
  .card-name .tt { height: 44px; }
}

/* ---------- order: the road ---------- */
.road { position: relative; height: clamp(150px, 22vw, 250px); margin-top: clamp(40px, 7vh, 80px); }
.art-palm { position: absolute; inset-block-end: 0; inset-inline-end: 4%; width: clamp(82px, 11vw, 150px); }
.art-scooter { position: absolute; inset-block-end: 0; inset-inline-start: 0; width: clamp(150px, 20vw, 260px); will-change: transform; }
html[dir="rtl"] .art-scooter .art { transform: scaleX(-1); }   /* it faces the way it rides */

/* ---------- collab ---------- */
.notes { margin: 0 0 34px; display: grid; gap: 24px; }
.notes dt { font-size: 20px; font-weight: 400; }
.notes dd { margin: 4px 0 0; color: var(--soft); }

/* ---------- the glass ---------- */
.glass { padding: var(--gap) 0 calc(28px + env(safe-area-inset-bottom)); }
.mural { margin: 0 0 clamp(60px, 9vh, 110px); }
.mural-frame { position: relative; width: min(100% - var(--pad) * 2, 1380px); margin-inline: auto; aspect-ratio: 8022 / 5754; overflow: hidden; }
.mural-img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; }
.js .mural-frame { -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 calc(var(--r, 0) * 1%), transparent calc(var(--r, 0) * 1% + 14%)); mask-image: radial-gradient(circle at 50% 50%, #000 calc(var(--r, 0) * 1%), transparent calc(var(--r, 0) * 1% + 14%)); }
.mural-caption { text-align: center; margin-top: 26px; font-size: 14.5px; color: var(--soft); }
.footer-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px 40px; }
.footer-row p { margin: 0; }
.footer-links { list-style: none; margin: 0; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; }
@media (max-width: 767px) {
  .mural-frame { width: 100%; aspect-ratio: auto; height: min(78svh, 620px); }
  .mural-img { inset: auto; left: 50%; top: 50%; width: 250vw; height: auto; transform: translate(-50%, -50%); }
  .js .mural-frame { -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 calc(var(--r, 0) * 1.6%), transparent calc(var(--r, 0) * 1.6% + 18%)); mask-image: radial-gradient(circle at 50% 50%, #000 calc(var(--r, 0) * 1.6%), transparent calc(var(--r, 0) * 1.6% + 18%)); }
  .footer-row { flex-direction: column; align-items: flex-start; }
}

/* ---------- the line ---------- */
.ink { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; z-index: 2; }
.ink .ink-link { fill: none; stroke: var(--ink); stroke-width: var(--ink-w); stroke-linecap: butt; stroke-linejoin: round; }
.ink .ink-ghost { fill: none; stroke: none; }
.ink.has-sky .ink-link { stroke: var(--sky-id); }

/* the head of the line: the Tada magic */
.magic { position: fixed; z-index: 30; top: 0; left: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none; opacity: 0; color: var(--tada); will-change: transform; }
.magic.on-dark { color: #F3E6FA; }
.magic svg { width: 100%; height: 100%; overflow: visible; }
.magic .m-star { fill: currentColor; }
.magic .m-core { fill: #fff; }
.magic .m-spin { transform-origin: 22px 22px; animation: spin 9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.magic-dust { position: fixed; z-index: 29; inset: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

/* the cursor shows the glass's dots where it passes (mouse only) */
.aura { position: fixed; z-index: 1; inset: 0; pointer-events: none; opacity: 0; transition: opacity .8s var(--ease);
  background-image: radial-gradient(circle, rgba(167, 133, 186, .55) 1.3px, transparent 1.9px); background-size: 26px 26px;
  -webkit-mask-image: radial-gradient(circle 170px at var(--mx, -400px) var(--my, -400px), #000, transparent);
  mask-image: radial-gradient(circle 170px at var(--mx, -400px) var(--my, -400px), #000, transparent); }
.aura.is-on { opacity: 1; }
@media (pointer: coarse) { .aura { display: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .menu-stage { overflow-x: auto; scroll-snap-type: x mandatory; }
  .card { scroll-snap-align: center; }
  .js .art.is-waiting .s, .js .art.is-waiting .f, .js .tt.is-waiting path { opacity: 1; }
}

/* grid children never grow past their column (the written headlines carry a width of their own) */
.split > *, .hero-grid > *, .text { min-width: 0; }
/* Doran's Latin runs small beside its Persian: English reads a step larger */
html[lang="en"] body { font-size: 19.5px; }
html[lang="en"] .lead { font-size: clamp(20.5px, 1.6vw, 24px); }
html[lang="en"] .small, html[lang="en"] .status, html[lang="en"] .hours-title, html[lang="en"] .order-label { font-size: 15.5px; }
html[lang="en"] .nav-links a, html[lang="en"] .btn { font-size: 16px; }
html[lang="en"] .card-note { font-size: 17.5px; }
@media (max-width: 767px) { html[lang="en"] body { font-size: 18.5px; } }


/* ---------- branches: rows on a route ---------- */
.rows { list-style: none; margin: clamp(40px, 7vh, 72px) 0 0; padding: 0; }
.rows li { min-height: 112px; display: grid; grid-template-columns: 52px 9em 1fr max-content; align-items: center; gap: 24px; }
.row-art { width: 44px; height: 66px; }
.row-art .art-slot, .row-art .art { height: 100%; width: auto; }
.row-name { font-size: clamp(21px, 2vw, 28px); font-weight: 400; transition: text-shadow 1.2s var(--ease); }
.row-addr { font-weight: 300; color: var(--soft); }
.row-route { font-size: 15px; text-underline-offset: 5px; text-decoration-thickness: 1px; padding: 10px 0; }
.rows li.is-reached .row-name { text-shadow: 0 0 22px rgba(201, 179, 210, .55); }
.rows-hours { margin-top: 28px; }
@media (max-width: 700px) {
  .rows li { min-height: 96px; grid-template-columns: 40px 1fr max-content; grid-template-rows: auto auto; align-content: center; gap: 2px 16px; }
  .row-art { grid-row: span 2; width: 36px; height: 54px; }
  .row-name { grid-column: 2; }
  .row-route { grid-column: 3; grid-row: 1 / span 2; align-self: center; }
  .row-addr { grid-column: 2; font-size: 15px; }
}

/* ---------- the mark, wherever it is ---------- */
.tada-hand, .tada-words { display: block; overflow: visible; }
.hand-part, .hand-star { fill: currentColor; }
.word-stroke { fill: none; stroke: currentColor; stroke-linecap: butt; stroke-linejoin: miter; }
.burst-line { fill: none; stroke: currentColor; stroke-width: 10; stroke-linecap: round; }
.hand-guide { fill: none; stroke: none; }
.door-svg { color: var(--cream); }
.nav-mark .tada-hand { width: 100%; height: 100%; }
.glass-hand { color: #F4EEF7; cursor: pointer; }

/* ---------- the pen's tip, while a piece draws itself ---------- */
.quill { position: fixed; z-index: 31; top: 0; left: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none; color: var(--tada); will-change: transform; }
.quill.on-dark { color: #F3E6FA; }
.quill svg { width: 100%; height: 100%; overflow: visible; }
.quill .q-glow { fill: currentColor; opacity: .16; }
.quill .q-star { fill: currentColor; }
.quill .q-core { fill: #fff; }
.quill.is-loader { z-index: 102; transition: opacity .3s; }

/* ---------- the cursor's lozenges (mouse) ---------- */
.aura { position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .8s var(--ease); --tile: 46px;
  background: var(--tile-night) 0 0 / var(--tile) var(--tile) repeat;
  -webkit-mask-image: radial-gradient(170px circle at var(--ax, -999px) var(--ay, -999px), #000 0%, rgba(0, 0, 0, .55) 50%, transparent 100%), radial-gradient(320px circle at var(--bx, -999px) var(--by, -999px), rgba(0, 0, 0, .42) 0%, transparent 100%);
          mask-image: radial-gradient(170px circle at var(--ax, -999px) var(--ay, -999px), #000 0%, rgba(0, 0, 0, .55) 50%, transparent 100%), radial-gradient(320px circle at var(--bx, -999px) var(--by, -999px), rgba(0, 0, 0, .42) 0%, transparent 100%); }
[data-surface="day"] > .aura { background-image: var(--tile-day); }
.aura.is-on { opacity: .42; }
[data-surface="day"] > .aura.is-on { opacity: .3; }
@media (pointer: coarse) { .aura { display: none; } }
/* a control that was just pressed glows for a moment, like a struck match */
.is-magic { animation: is-magic .9s cubic-bezier(.16, 1, .3, 1); }
@keyframes is-magic { 0% { text-shadow: 0 0 0 rgba(201, 179, 207, 0); } 25% { text-shadow: 0 0 14px rgba(201, 179, 207, .9), 0 0 2px rgba(255, 255, 255, .8); } 100% { text-shadow: 0 0 0 rgba(201, 179, 207, 0); } }

/* ---------- the entrance and the loader ---------- */
.loader { position: fixed; inset: 0; z-index: 100; color: var(--cream); pointer-events: none; }
.loader:not(.is-ready) { background: var(--night); }
.loader.is-done { display: none; }
.ld-bg { position: absolute; inset: 0; }
.ld-veil { display: block; width: 100%; height: 100%; }
.ld-night { fill: #150420; }
.ld-edge-fill { fill: var(--cream); }
.ld-edge-line { fill: none; stroke: #C9B3CF; stroke-linejoin: round; }
.ld-stage, .ld-word { position: absolute; }
.ld-stage .tada-hand, .ld-word .tada-words { width: 100%; height: 100%; }
.ld-skip, .ld-sound { position: absolute; bottom: clamp(16px, 4vw, 36px); padding: 10px 6px; border: 0; background: none; cursor: pointer; font: 400 14px/1 var(--font); color: var(--cream); pointer-events: auto; opacity: .8; }
.ld-skip { inset-inline-end: clamp(16px, 4vw, 40px); }
.ld-sound { inset-inline-start: clamp(16px, 4vw, 40px); }
.ld-sound[aria-pressed="false"] { opacity: .55; }
.loader.is-done .ld-sound { display: none; }
.ld-gate { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  background: #150420; color: var(--cream); pointer-events: auto; text-align: center; padding: 24px; }
.ld-gate ~ .ld-sound, .ld-gate ~ .ld-skip { visibility: hidden; }
.ld-gate-star { width: 30px; height: 30px; filter: drop-shadow(0 0 12px rgba(201, 179, 207, .6)); animation: gate-breathe 2.6s ease-in-out infinite; }
.ld-gate-star svg { display: block; width: 100%; height: 100%; overflow: visible; }
.ld-gate-star path { fill: currentColor; }
@keyframes gate-breathe { 0%, 100% { transform: scale(.9) rotate(0deg); opacity: .8; } 50% { transform: scale(1.06) rotate(10deg); opacity: 1; } }
.ld-gate-bar { position: relative; width: min(200px, 56vw); height: 2px; border-radius: 2px; background: rgba(201, 179, 207, .18); }
.ld-gate-bar i { position: absolute; inset: 0; border-radius: inherit; transform: scaleX(0); transform-origin: right center;
  background: linear-gradient(270deg, rgba(201, 179, 207, .5), #FFFFFF 70%, rgba(255, 255, 255, .9)); box-shadow: 0 0 10px rgba(201, 179, 207, .8), 0 0 22px rgba(146, 109, 143, .5); }
.ld-gate-bar b { position: absolute; top: 50%; right: calc(var(--p, 0) * 100%); width: 7px; height: 7px; margin: -3.5px -3.5px 0 0; border-radius: 50%;
  background: #FFFFFF; box-shadow: 0 0 8px 2px rgba(255, 255, 255, .85), 0 0 18px 4px rgba(201, 179, 207, .6); }
[dir="ltr"] .ld-gate-bar i { transform-origin: left center; }
[dir="ltr"] .ld-gate-bar b { right: auto; left: calc(var(--p, 0) * 100%); margin: -3.5px 0 0 -3.5px; }
.ld-gate-label { margin: 0; font: 300 13.5px/1.6 var(--font); letter-spacing: .02em; opacity: .72; }
.ld-gate.is-waiting { cursor: pointer; }
.ld-gate.is-waiting .ld-gate-star { width: 38px; height: 38px; animation: gate-call 2.4s ease-in-out infinite;
  filter: drop-shadow(0 0 14px rgba(201, 179, 207, .9)) drop-shadow(0 0 34px rgba(146, 109, 143, .55)); transition: width .8s, height .8s; }
@keyframes gate-call { 0%, 100% { transform: scale(.92) rotate(0deg); opacity: .85; } 50% { transform: scale(1.12) rotate(45deg); opacity: 1; } }
.ld-gate.is-waiting .ld-gate-label { font-size: 14.5px; animation: gate-ask 2.4s ease-in-out infinite; }

<body>
<a class="skip-link" href="#morning" data-t="skipTo">پرش به محتوا</a>

<!-- The entrance and the loader: the star and the bar of light; then one pen draws the mark,
     writes تادا / TADA, the hand snaps, and the lowest sparkle opens the page. -->
<div class="loader" id="loader" role="status" aria-label="تادا">
  <div class="ld-bg"></div>
  <div class="ld-stage"></div>
  <div class="ld-word"></div>
  <div class="ld-gate" id="ldGate">
    <div class="ld-gate-star" aria-hidden="true"></div>
    <div class="ld-gate-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="ldGateLabel"><i></i><b aria-hidden="true"></b></div>
    <p class="ld-gate-label" id="ldGateLabel" data-t="gate.loading">در حال آماده‌سازی…</p>
  </div>
  <button class="ld-sound sound-toggle" type="button" aria-pressed="true" data-sfx="none">صدا روشن</button>
  <button class="ld-skip" type="button" data-t="skip">رد کردن</button>
</div>

<header class="nav" id="nav" data-ink="night">
  <a class="nav-mark" id="navMark" href="#top" aria-label="تادا"></a>
  <nav class="nav-links" aria-label="بخش‌ها">
    <a href="#morning" data-t="nav.morning">تادا</a>
    <a href="#menu" data-t="nav.menu">منو</a>
    <a href="#branches" data-t="nav.branches">شعبه‌ها</a>
    <a href="#order" data-t="nav.order">سفارش</a>
  </nav>
  <div class="nav-tools">
    <button class="btn btn-quiet sound-toggle" type="button" aria-pressed="true">صدا روشن</button>
    <button class="btn btn-quiet nav-menu-btn" id="menuBtn" type="button" aria-controls="mMenu" aria-expanded="false" data-t="menuBtn">فهرست</button>
    <button class="btn btn-quiet lang-toggle" id="langToggle" type="button" lang="en" data-t="langSwitch">EN</button>
  </div>
</header>

<!-- Phone index: opens from the nav. The page behind is inert while it is open. -->
<div class="mmenu" id="mMenu" data-surface="night" role="dialog" aria-modal="true" aria-labelledby="mMenuTitle" hidden>
  <div class="mmenu-head">
    <p class="mmenu-title" id="mMenuTitle" data-t="menuBtn">فهرست</p>
    <button class="btn btn-quiet mmenu-close" type="button" data-t="menuClose">بستن</button>
  </div>
  <nav class="mmenu-links" aria-label="بخش‌ها">
    <a href="#top" data-t="nav.top">آغاز</a>
    <a href="#morning" data-t="nav.morning">تادا</a>
    <a href="#menu" data-t="nav.menu">منو</a>
    <a href="#branches" data-t="nav.branches">شعبه‌ها</a>
    <a href="#order" data-t="nav.order">سفارش</a>
    <a href="#collab" data-t="nav.collab">همکاری</a>
  </nav>
  <div class="mmenu-tools">
    <button class="btn sound-toggle" type="button" aria-pressed="true">صدا روشن</button>
    <button class="btn lang-toggle" type="button" lang="en" data-t="langSwitch">EN</button>
  </div>
</div>

<main id="top">

  <!-- The door: the arch from the glass, the snapping hand, the wordmarks. It draws itself
       while the site loads; its last stroke is where the Tada magic begins. -->
  <section class="hero" id="hero" data-surface="night">
    <div class="hero-grid">
      <div class="hero-side hero-words">
        <h1 class="hero-tagline">
          <span class="sr" data-t="hero.tagline">نُت جادویی طعم</span>
          <span class="art-slot" data-art="tagline" data-art-lang="fa"></span>
          <span class="en-line" data-t="hero.tagline" aria-hidden="true"></span>
        </h1>
        <a class="insta-link" id="heroInsta" href="https://www.instagram.com/tada_lounge/" rel="noopener">
          <span class="sr" data-t="hero.insta">تادا در اینستاگرام</span>
          <span class="art-slot" data-art="insta"></span>
        </a>
      </div>
      <div class="hero-door">
        <div class="door" id="door" role="img" aria-label="تادا، TADA">
          <div class="door-film" id="doorFilm" hidden></div>
        </div>
        <div class="sill" aria-hidden="true">
          <span class="art-slot" data-art="lozenge"></span>
          <span class="art-slot" data-art="dotRow"></span>
        </div>
      </div>
      <div class="hero-side hero-hours">
        <div class="hours-card">
          <p class="hours-title"><i class="star" aria-hidden="true"></i><span data-t="hero.hoursTitle">ساعت کاری</span></p>
          <p class="hours-row"><span data-t="hero.morning">صبح ۹ تا ۱۶</span></p>
          <p class="hours-row"><span data-t="hero.evening">عصر ۱۷ تا ۲۳</span></p>
          <p class="status" id="openStatus" aria-live="polite"></p>
          <a class="order-link" href="https://tada.ir" rel="noopener">
            <span class="order-label"><i class="star" aria-hidden="true"></i><span data-t="hero.order">سفارش آنلاین از وبسایت</span></span>
            <span class="art-slot" data-art="tadaIr" role="img" aria-label="tada.ir"></span>
          </a>
        </div>
      </div>
    </div>
    <p class="hero-cue" data-t="hero.cue" aria-hidden="true">بفرمایید تو</p>
    <svg class="ink" data-ink="hero" aria-hidden="true"></svg>
  </section>

  <!-- Morning: the day comes up through the brand's purples. -->
  <section class="chapter morning" id="morning" data-surface="day">
    <div class="sky sky-dawn" aria-hidden="true"></div>
    <div class="container split">
      <div class="text">
        <h2 class="tt-h" data-tt="morning.title"></h2>
        <p class="lead" data-t="morning.lead"></p>
        <p class="body" data-t="morning.body"></p>
      </div>
      <div class="art-col art-morning">
        <span class="art-slot art-sun" data-art="sun"></span>
        <span class="art-slot art-kettle" data-art="kettle"></span>
      </div>
    </div>
    <svg class="ink" data-ink="morning" aria-hidden="true"></svg>
  </section>

  <section class="chapter bar" id="bar" data-surface="day">
    <div class="container split">
      <div class="text">
        <h2 class="tt-h" data-tt="bar.title"></h2>
        <p class="lead" data-t="bar.lead"></p>
        <div class="pack" id="pack"></div>
      </div>
      <div class="art-col art-bar">
        <span class="art-slot art-path" data-art="coffeePath"></span>
        <span class="art-slot art-espresso" data-art="espresso"></span>
      </div>
    </div>
    <svg class="ink" data-ink="bar" aria-hidden="true"></svg>
  </section>

  <!-- The menu: pinned. The flavors pass one at a time; each has its note. -->
  <section class="menu" id="menu" data-surface="day" aria-roledescription="carousel">
    <div class="menu-inner">
      <div class="container menu-head">
        <h2 class="tt-h" data-tt="menu.title"></h2>
        <p class="lead" data-t="menu.lead"></p>
      </div>
      <div class="menu-stage" id="menuStage">
        <div class="menu-track" id="menuTrack" role="list">
          <svg class="ink ink-track" aria-hidden="true"></svg>
        </div>
      </div>
      <div class="menu-dots" id="menuDots" aria-hidden="true"></div>
    </div>
    <svg class="ink" data-ink="menu" aria-hidden="true"></svg>
  </section>

  <!-- Evening: the day goes down into the night of the glass. -->
  <section class="chapter evening" id="evening" data-surface="night">
    <div class="sky sky-dusk" aria-hidden="true"></div>
    <div class="container split">
      <div class="text">
        <h2 class="tt-h" data-tt="evening.title"></h2>
        <p class="lead" data-t="evening.lead"></p>
        <p class="body" data-t="evening.body"></p>
      </div>
      <div class="art-col art-evening">
        <span class="art-slot art-hat" data-art="hat"></span>
      </div>
    </div>
    <svg class="ink" data-ink="evening" aria-hidden="true"></svg>
  </section>

  <section class="chapter branches" id="branches" data-surface="night">
    <div class="container">
      <div class="text narrow">
        <h2 class="tt-h" data-tt="branches.title"></h2>
        <p class="lead" data-t="branches.lead"></p>
      </div>
      <ol class="rows" id="branchRows"></ol>
      <p class="small soft rows-hours" data-t="branches.hours"></p>
    </div>
    <svg class="ink" data-ink="branches" aria-hidden="true"></svg>
  </section>

  <section class="chapter order" id="order" data-surface="night">
    <div class="container">
      <div class="text narrow">
        <h2 class="tt-h" data-tt="order.title"></h2>
        <p class="lead" data-t="order.lead"></p>
        <p><a class="btn btn-line" href="https://tada.ir" rel="noopener" data-t="order.cta">سفارش در tada.ir</a></p>
      </div>
      <div class="road" id="road" aria-hidden="true">
        <span class="art-slot art-palm" data-art="palm"></span>
        <span class="art-slot art-scooter" data-art="scooter"></span>
      </div>
    </div>
    <svg class="ink" data-ink="order" aria-hidden="true"></svg>
  </section>

  <section class="chapter collab" id="collab" data-surface="night">
    <div class="container">
      <div class="text narrow">
        <h2 class="tt-h" data-tt="collab.title"></h2>
        <dl class="notes" id="collabItems"></dl>
        <p><a class="btn btn-line" href="https://www.instagram.com/tada_lounge/" rel="noopener" data-t="collab.cta">پیام در اینستاگرام</a></p>
      </div>
    </div>
    <svg class="ink" data-ink="collab" aria-hidden="true"></svg>
  </section>

</main>

<!-- The ending: step back outside and see the whole glass. -->
<footer class="glass" id="glass" data-surface="night">

<script>
/* Tada letters: writes Persian with the brand alphabet (TADA_GLYPHS, from the designer's
   sheet). Picks each letter's joined form, joins letters on the baseline, and returns an SVG
   of centerline strokes that can be written on stroke by stroke.
   Tatweel (ـ) in the text stretches a join, as the designer does in «تــادا لانژ».     */
const TadaType = (() => {
  const G = TADA_GLYPHS.g, O = TADA_GLYPHS.orn, ALEF = TADA_GLYPHS.meta.alef;
  const DUAL = new Set('بپتثجچحخسشصضطظعغفقکگلمنهیئـ');
  const RIGHT = new Set('اآدذرزژو');
  const NORM = { 'ي': 'ی', 'ى': 'ی', 'ك': 'ک', 'ة': 'ه', 'ۀ': 'ه', 'أ': 'ا', 'إ': 'ا', 'ٱ': 'ا', 'ؤ': 'و', '٠': '۰', '١': '۱', '٢': '۲', '٣': '۳', '٤': '۴', '٥': '۵', '٦': '۶', '٧': '۷', '٨': '۸', '٩': '۹' };
  const MARKS = /[ً-ٰٟؐ-ؚ]/g;   // harakat are left out
  const DIGIT = /[0-9۰-۹]/;
  const KASHIDA = 64, GAP = 38, WORD = 104;
  // the looped meem reads at a glance; the slashed one stays for the designer's own words
  const PREF = { 'م.i': 'م.i2', 'م.m': 'م.m2', 'م.f': 'م.f2', 'م.s': 'م.s2' };
  // where an alef or madda alef takes the join: its stem
  const STEM = { 'ا': 0, 'آ': 37.1 };
  const NS = 'http://www.w3.org/2000/svg';

  const joinsNext = ch => DUAL.has(ch);
  const joinsPrev = ch => DUAL.has(ch) || RIGHT.has(ch);

  // Each joining form on the sheet carries its own connector on the baseline, drawn at full
  // length for the specimen. Set end to end, two connectors make a double gap between
  // letters; joined, they lie over one another, as a pen writes them: one stroke between.
  // lc / rc: the length of the baseline run leaving the glyph's left / right edge.
  const OVER = 0.9;
  function stubs(g) {
    if (g.__st) return g.__st;
    let lc = 0, rc = 0;
    for (const d of g.p) {
      const n = d.match(/[MLHVC]|-?[\d.]+/g); let c = '', x = 0, y = 0;
      for (let i = 0; i < n.length;) {
        if (/[MLHVC]/.test(n[i])) { c = n[i++]; continue; }
        const x0 = x, y0 = y;
        if (c === 'H') x = +n[i++];
        else if (c === 'V') y = +n[i++];
        else if (c === 'C') { x = +n[i + 4]; y = +n[i + 5]; i += 6; }
        else { x = +n[i]; y = +n[i + 1]; i += 2; }
        if (c === 'M') continue;
        // on the baseline (a few letters, like the final ه, sit their connector a hair below it)
        if (Math.abs(y0 - y) < 0.5 && Math.abs(y) < 14 && Math.abs(x - x0) > 1) {
          const a = Math.min(x0, x), b = Math.max(x0, x);
          if (a < 1.5) lc = Math.max(lc, b);
          if (b > g.w - 1.5) rc = Math.max(rc, g.w - a);
        }
      }
    }
    return (g.__st = { lc: Math.min(lc, g.w), rc: Math.min(rc, g.w) });
  }

  function form(ch, prevJ, nextJ) {
    if (DIGIT.test(ch)) return G[ch + '.d'] ? ch + '.d' : null;
    if (ch === 'ـ') return 'ـ';
    const f = prevJ && nextJ ? 'm' : prevJ ? 'f' : nextJ ? 'i' : 's';
    for (const k of [f, f === 'm' ? 'i' : f === 'f' ? 's' : 's']) {
      const n = `${ch}.${k}`, p = PREF[n];
      if (p && G[p]) return p;
      if (G[n]) return n;
    }
    return null;
  }

  /** Lays the text out right to left. Returns glyph placements in sheet units. */
  function shape(text, o = {}) {
    const kash = o.kashida ?? KASHIDA, gap = o.gap ?? GAP, word = o.word ?? WORD;
    const s = [...String(text).normalize('NFC').replace(MARKS, '')].map(c => NORM[c] || c);
    const out = [];
    let x = 0, prevLeftJoin = false, lastLeft = 0, prevStub = 0;
    let i = 0;
    while (i < s.length) {
      const ch = s[i];
      if (ch === ' ' || ch === ' ') { x = lastLeft - word; prevLeftJoin = false; i++; continue; }
      if (ch === '‌') { x = lastLeft - gap * 0.6; prevLeftJoin = false; i++; continue; }
      if (DIGIT.test(ch)) {                     // numbers read left to right inside the line
        let j = i; while (j < s.length && DIGIT.test(s[j])) j++;
        const run = s.slice(i, j).reverse();
        let cx = (prevLeftJoin ? lastLeft : x) - (out.length ? gap : 0);
        for (const d of run) {
          const name = form(d); if (!name) continue;
          const g = G[name];
          out.push({ name, g, x: cx - g.w }); cx -= g.w + gap * 0.9;
        }
        lastLeft = cx + gap * 0.9; x = lastLeft; prevLeftJoin = false; i = j; continue;
      }
      if (ch === 'ـ') {                         // stretch the join
        if (prevLeftJoin) { out.push({ name: 'ـ', line: kash, x: lastLeft - kash }); lastLeft -= kash; prevStub = 0; }
        i++; continue;
      }
      const prev = (() => { for (let j = i - 1; j >= 0; j--) { if (s[j] !== 'ـ') return s[j]; } return ''; })();
      const next = (() => { for (let j = i + 1; j < s.length; j++) { if (s[j] !== 'ـ') return s[j]; } return ''; })();
      const pj = prevLeftJoin && joinsPrev(ch);
      const nj = joinsNext(ch) && next && joinsPrev(next) && next !== ' ';
      const name = form(ch, pj, nj);
      if (!name) { i++; continue; }
      const g = G[name];
      let gx;
      // joined: this letter's connector lies over the previous one's (one stroke between)
      if (pj) gx = lastLeft - (ch in STEM ? STEM[ch] : g.w) + (ch in STEM ? 0 : Math.min(prevStub, stubs(g).rc) * OVER);
      else gx = (out.length ? x - gap : 0) - g.w;
      out.push({ name, g, x: gx });
      lastLeft = gx; x = gx;
      prevLeftJoin = nj;
      prevStub = nj ? stubs(g).lc : 0;
      i++;
    }
    let min = Infinity, max = -Infinity, top = Infinity, bot = -Infinity;
    for (const q of out) {
      const w = q.g ? q.g.w : q.line, y = q.g ? q.g.y : [0, 0];
      min = Math.min(min, q.x); max = Math.max(max, q.x + w);
      top = Math.min(top, y[0]); bot = Math.max(bot, y[1]);
    }
    return { glyphs: out, x0: min, x1: max, top, bot };
  }

  // the sheet extends stems half a stroke below the baseline to square the corners; at
  // another weight that half stroke changes with it
  function fitBase(d, half) {
    return d.replace(/([MLV])(-?[\d.]+)(?: (-?[\d.]+))?/g, (m, c, a, b) => {
      if (c === 'V') { const y = +a; return y > 0.5 && y < 8 ? `V${half}` : m; }
      const y = +b; return y > 0.5 && y < 8 ? `${c}${a} ${half}` : m;
    });
  }

  function bbox(d) {
    const n = d.match(/[MLHVC]|-?[\d.]+/g); let c = '', x = 0, y = 0;
    const xs = [], ys = [];
    for (let i = 0; i < n.length;) {
      if (/[MLHVC]/.test(n[i])) { c = n[i++]; continue; }
      if (c === 'H') x = +n[i++];
      else if (c === 'V') y = +n[i++];
      else if (c === 'C') { xs.push(+n[i], +n[i + 2]); ys.push(+n[i + 1], +n[i + 3]); x = +n[i + 4]; y = +n[i + 5]; i += 6; }
      else { x = +n[i]; y = +n[i + 1]; i += 2; }
      xs.push(x); ys.push(y);
    }
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    return { x0, x1, y0, y1, w: x1 - x0, h: y1 - y0 };
  }

  /**
   * Writes text as an SVG. o.size = alef height in px; o.weight = stroke as a share of the
   * alef height (the mural uses about 0.06); o.align = 'right' | 'center' | 'left'.
   * Each stroke is a <path class="tt-s">, in writing order.
   */
  function svg(text, o = {}) {
    const L = shape(text, o);
    const weight = o.weight ?? 0.06, sw = weight * ALEF, half = +(sw / 2).toFixed(2);
    const pad = sw;
    const vb = [L.x0 - pad, L.top - pad, L.x1 - L.x0 + pad * 2, L.bot - L.top + pad * 2];
    const el = document.createElementNS(NS, 'svg');
    el.setAttribute('viewBox', vb.map(v => +v.toFixed(1)).join(' '));
    el.setAttribute('class', 'tt' + (o.cls ? ' ' + o.cls : ''));
    el.setAttribute('aria-hidden', 'true');
    el.setAttribute('focusable', 'false');
    el.style.setProperty('--tt-sw', sw.toFixed(2));
    if (o.size) {
      const k = o.size / ALEF;
      el.setAttribute('width', (vb[2] * k).toFixed(1)); el.setAttribute('height', (vb[3] * k).toFixed(1));
    }
    el.dataset.units = (vb[2]).toFixed(1);
    const strokes = [];
    for (const q of L.glyphs) {
      if (q.line) { strokes.push({ d: `M${(q.x + q.line).toFixed(1)} 0H${q.x.toFixed(1)}`, x: q.x + q.line, dot: false }); continue; }
      const g = q.g;
      for (const raw of g.p) {
        const d = fitBase(raw, half);
        const b = bbox(raw);
        const dot = g.p.length > 1 && b.w < 44 && b.h < 26 && (b.y1 < -20 || b.y0 > 20);
        strokes.push({ d, x: q.x + b.x1, dot, tx: q.x });
      }
      for (const f of g.fill || []) strokes.push({ d: f, x: q.x + g.w, fill: true, tx: q.x });
    }
    // writing order: bodies from right to left, then the dots of the word
    const bodies = strokes.filter(s => !s.dot && !s.fill).sort((a, b) => b.x - a.x);
    const dots = strokes.filter(s => s.dot || s.fill).sort((a, b) => b.x - a.x);
    for (const s of [...bodies, ...dots]) {
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', s.d);
      if (s.tx !== undefined) p.setAttribute('transform', `translate(${s.tx.toFixed(1)} 0)`);
      p.setAttribute('class', s.fill ? 'tt-f' : s.dot ? 'tt-s tt-dot' : 'tt-s');
      el.appendChild(p);
    }
    return el;
  }

  return { shape, svg, glyphs: G, ornaments: O, ALEF };
})();

<script>
// TADA sound
// ----------
// A small Web Audio synthesiser: no audio files, nothing to download. Reverse-
// engineered from the reference app's sound module (see REVERSE-ENGINEERING.md):
// one AudioContext → master gain → compressor → destination, a generated-noise
// convolver for reverb, a white-noise buffer for swept "air", tone/noise helpers
// with exponential envelopes, a per-sound throttle and a pentatonic scale. The
// presets are TADA's own: the snap, the sparkles, the star opening, the ink.
//
// Browsers only let audio start after a user gesture: the engine is created on
// the first pointer/key event (or when the user turns sound on). Until then every
// call is a silent no-op. Preference is remembered in localStorage ('tada.sound').
//
// Some browsers let a site sound before any gesture (the visitor allowed it, or has
// played here before): probe() asks quietly, and the entrance plays from the start
// when the answer is yes. iOS only opens audio inside touchend or click, so those
// unlock too.
//
// Exposes window.TadaSound = { enabled(), setEnabled(v), toggle(), unlock(), probe(), sfx, bind() }.

(function () {
  'use strict';

  const KEY = 'tada.sound';
  let wanted = true;
  try { wanted = localStorage.getItem(KEY) !== 'off'; } catch {}
  const listeners = new Set();

  let ctx = null, master = null, verb = null, noise = null;

  // Exponentially decaying stereo noise: a small room without a sample.
  function impulse(c, seconds, decay) {
    const n = Math.floor(c.sampleRate * seconds), buf = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
    }
    return buf;
  }

  let gestured = false;   // browsers refuse audio before the first user gesture
  function engine() {
    if (!wanted || !gestured) return null;
    if (!ctx) {
      if (typeof AudioContext === 'undefined') return null;
      ctx = new AudioContext();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 5;
      ctx.addEventListener('statechange', () => heardNow());
      comp.connect(ctx.destination);
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(comp);
      const conv = ctx.createConvolver(); conv.buffer = impulse(ctx, 1.8, 3);
      verb = ctx.createGain(); verb.gain.value = 0.22; verb.connect(conv).connect(master);
      noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume().then(heardNow, () => {});
    return ctx;
  }

  function out(c, node, reverb, pan) {
    let n = node;
    if (pan) { const p = c.createStereoPanner(); p.pan.value = pan; n.connect(p); n = p; }
    n.connect(master);
    if (reverb) n.connect(verb);
  }

  // A tone with an exponential attack/decay envelope, optional pitch slide.
  function tone(freq, dur, o = {}) {
    const c = engine(); if (!c) return;
    const { type = 'sine', gain = 0.05, attack = 0.004, slideTo, delay = 0, reverb = false, pan = 0 } = o;
    const t = c.currentTime + delay;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(1e-4, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(1e-4, t + dur);
    osc.connect(g); out(c, g, reverb, pan);
    osc.start(t); osc.stop(t + dur + 0.05);
  }

  // Filtered noise with a sweeping centre frequency: air, cracks, whooshes.
  function air(dur, o = {}) {
    const c = engine(); if (!c || !noise) return;
    const { gain = 0.04, from = 800, to = 3000, q = 0.8, delay = 0, reverb = false, filter = 'bandpass' } = o;
    const t = c.currentTime + delay;
    const src = c.createBufferSource(); src.buffer = noise;
    const f = c.createBiquadFilter(); f.type = filter; f.Q.value = q;
    f.frequency.setValueAtTime(from, t);
    f.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(1e-4, t);
    g.gain.exponentialRampToValueAtTime(gain, t + Math.max(0.005, dur * 0.25));
    g.gain.exponentialRampToValueAtTime(1e-4, t + dur);
    src.connect(f).connect(g); out(c, g, reverb, 0);
    src.start(t, Math.random()); src.stop(t + dur + 0.05);
  }

  const last = new Map();
  const every = (key, ms) => { const n = performance.now(); if (n - (last.get(key) ?? -Infinity) < ms) return false; last.set(key, n); return true; };
  const note = n => 523.25 * Math.pow(2, n / 12);           // C5 + semitones
  const PENTA = [0, 2, 4, 7, 9];

  // Tiny high blips with random pan: the sparkle.
  function sparkles(delay = 0, count = 3, gain = 0.008) {
    for (let i = 0; i < count; i++) tone(2800 + Math.random() * 2600, 0.09, { gain, delay: delay + Math.random() * 0.07, reverb: true, pan: Math.random() * 1.2 - 0.6 });
  }
  function arp(notes, { gap = 0.07, gain = 0.04, type = 'triangle' } = {}) {
    notes.forEach((n, i) => tone(note(n), 0.35, { type, gain, delay: i * gap, reverb: true }));
  }

  // The sound of the line: a soft nib on paper. One looping voice of filtered noise
  // whose loudness follows how fast the line is being drawn (0 = still).
  let inkV = null;
  function inkVoice() {
    const c = engine(); if (!c || !noise) return null;
    if (inkV) return inkV;
    const src = c.createBufferSource(); src.buffer = noise; src.loop = true;
    // soft and low: a felt nib on thick paper, never a hiss
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 0.6;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    const g = c.createGain(); g.gain.value = 0;
    // the fibres of the paper under the nib: the band trembles a little
    const lfo = c.createOscillator(); lfo.frequency.value = 5.1;
    const depth = c.createGain(); depth.gain.value = 220;
    lfo.connect(depth).connect(bp.frequency); lfo.start();
    src.connect(hp).connect(bp).connect(lp).connect(g); g.connect(master);
    src.start();
    inkV = { c, g, bp };
    return inkV;
  }
  let inkLevel = 0;

  const sfx = {
    // the line being drawn: level 0..1, called as often as it changes
    ink(level) {
      level = Math.max(0, Math.min(1, level || 0));
      if (Math.abs(level - inkLevel) < 0.02) return;
      inkLevel = level;
      if (!level && !inkV) return;
      const v = inkVoice(); if (!v) return;
      const t = v.c.currentTime;
      v.g.gain.setTargetAtTime(level * 0.011, t, level ? 0.12 : 0.18);
      v.bp.frequency.setTargetAtTime(1500 + level * 500, t, 0.15);
    },
    // UI
    hover() { if (every('hover', 45)) tone(2300 + Math.random() * 200, 0.03, { gain: 0.007 }); },
    tap() { if (every('tap', 30)) { tone(1400, 0.045, { type: 'triangle', gain: 0.03, slideTo: 950 }); air(0.02, { gain: 0.01, from: 5000, to: 4000 }); } },
    nav() { tone(880, 0.07, { gain: 0.028, reverb: true }); tone(1318.5, 0.09, { gain: 0.022, delay: 0.035, reverb: true }); },
    toggle() { tone(1200, 0.03, { type: 'triangle', gain: 0.03 }); tone(1800, 0.035, { type: 'triangle', gain: 0.025, delay: 0.035 }); },
    enable() { arp([7, 12], { gap: 0.08, gain: 0.035, type: 'sine' }); },
    // Brand moments
    introDraw() { air(1.1, { gain: 0.01, from: 4000, to: 8000, reverb: true }); tone(220, 1.2, { gain: 0.025, slideTo: 440, attack: 0.3, reverb: true }); },
    pen() { if (every('pen', 140)) air(0.09, { gain: 0.0035, from: 1300 + Math.random() * 500, to: 2300, q: 0.8 }); },
    snap() {
      tone(120, 0.2, { gain: 0.14, slideTo: 55 });                        // the thump of the palm
      air(0.07, { gain: 0.07, from: 2600, to: 700, q: 0.5 });              // the crack
      tone(3200, 0.03, { type: 'triangle', gain: 0.02 });                  // the click
      sparkles(0.1, 4, 0.01);
    },
    starOpen() {
      air(0.9, { gain: 0.045, from: 400, to: 3200, reverb: true });        // the star sweeps out
      tone(note(0), 1.1, { gain: 0.03, slideTo: note(12), attack: 0.25, reverb: true });
      arp([0, 7, 12, 16], { gap: 0.09, gain: 0.03 });
      sparkles(0.35, 5, 0.009);
    },
    land() { tone(988, 0.3, { type: 'triangle', gain: 0.035, reverb: true }); tone(1245, 0.45, { type: 'triangle', gain: 0.03, delay: 0.09, reverb: true }); },
    chapter() { if (every('chapter', 300)) tone(1046.5, 0.14, { gain: 0.022, reverb: true }); },
    tada() { arp([0, 4, 7, 12], { gap: 0.07, gain: 0.035 }); sparkles(0.25, 4); },
    tile(i) { if (every('tile', 40)) tone(note(PENTA[i % 5] + 12 * Math.floor(i / 5)), 0.3, { gain: 0.026, reverb: true }); },
    bubble() { if (every('bubble', 60)) tone(600 + Math.random() * 300, 0.07, { gain: 0.022, slideTo: 1100 + Math.random() * 300 }); },
    // The entrance: a soft note for each stretch of the filling light, then the door opens
    gateNote(i) {
      tone(note(PENTA[i % 5]), 1.1, { gain: 0.018, attack: 0.05, reverb: true });
      tone(note(PENTA[i % 5] + 12), 0.8, { gain: 0.006, attack: 0.08, delay: 0.04, reverb: true });
      sparkles(0.08, 1, 0.005);
    },
    welcome() {
      arp([0, 7, 12], { gap: 0.1, gain: 0.022, type: 'sine' });
      sparkles(0.22, 3, 0.006);
    },
    gateOpen() {
      air(1.3, { gain: 0.028, from: 500, to: 4200, reverb: true });
      arp([0, 7, 12, 19], { gap: 0.12, gain: 0.026, type: 'sine' });
      sparkles(0.45, 4, 0.007);
    },
  };

  function setEnabled(v) {
    wanted = !!v; gestured = true;   // toggling is itself a gesture
    try { localStorage.setItem(KEY, wanted ? 'on' : 'off'); } catch {}
    if (wanted) { engine(); sfx.enable(); } else if (ctx && ctx.state === 'running') ctx.suspend();
    listeners.forEach(fn => fn(wanted));
  }
  const unlock = () => { gestured = true; if (wanted) engine(); };
  // call fn once, the first moment sound can actually be heard
  const firstSound = [];
  function onFirstSound(fn) {
    if (ctx && ctx.state === 'running') return;          // already heard: nothing to greet
    firstSound.push(fn);
  }
  function heardNow() {
    if (!ctx || ctx.state !== 'running' || !firstSound.length) return;
    const fns = firstSound.splice(0); setTimeout(() => fns.forEach(f => f()), 60);
  }
  // Ask, without a gesture, whether this browser already lets the site sound.
  function probe() {
    if (!wanted || typeof AudioContext === 'undefined') return Promise.resolve(false);
    if (matchMedia('(pointer: coarse)').matches && !gestured) return Promise.resolve(false);   // phones and tablets never allow it
    if (gestured && ctx && ctx.state === 'running') return Promise.resolve(true);
    const was = gestured; gestured = true;
    const c = engine(); gestured = was;
    if (!c) return Promise.resolve(false);
    return new Promise(r => setTimeout(() => { const ok = c.state === 'running'; if (ok) gestured = true; r(ok); }, 90));
  }

  // Global bindings: hover/tap on interactive elements, like the reference.
  const SEL = 'button, a[href], [role="button"], summary';
  let hovered = null;
  function bind() {
    document.addEventListener('pointerover', e => {
      if (e.pointerType !== 'mouse') return;
      const t = e.target.closest ? e.target.closest(SEL) : null;
      if (t === hovered) return;
      hovered = t;
      if (t && !t.matches(':disabled') && t.dataset.sfx !== 'none') sfx.hover();
    }, { passive: true });
    document.addEventListener('pointerdown', e => {
      if (e.button > 0) return;
      unlock();
      const t = e.target.closest ? e.target.closest(SEL) : null;
      if (!t || t.matches(':disabled')) return;
      const k = t.dataset.sfx;
      if (k === 'none') return;
      if (k && sfx[k]) return sfx[k]();
      (t.closest('.nav-links') ? sfx.nav : sfx.tap)();
    }, { passive: true });
    document.addEventListener('keydown', unlock, { passive: true, once: true });
    document.addEventListener('touchend', unlock, { passive: true });   // iOS opens audio here
    document.addEventListener('click', unlock, { passive: true });
    // a hidden tab never keeps a pen scratching
    document.addEventListener('visibilitychange', () => { if (document.hidden) sfx.ink(0); });
  }

  window.TadaSound = { enabled: () => wanted, setEnabled, toggle: () => setEnabled(!wanted), unlock, probe, onFirstSound, sfx, bind, onChange: fn => listeners.add(fn) };
})();

</script>
<script>
// TADA loader: the entrance, the snap, the star that opens the page
// ------------------------------------------------------------------
// The previous site's loader, now with the mark as the designer drew it on the glass.
// One pen draws the hand along the brand's own centerlines (each stroke reveals the
// designer's outlined mark beneath it, so what is drawn is never a redraw), writes
// «تادا» and «TADA», and the hand snaps: wind-up, a 70 ms release, the hit, the three
// sparkles popping, an elastic return to the exact mark. Then the lowest sparkle opens:
// it grows, glowing, until its points have swept the screen, and what it reveals is the
// page. The hand and the wordmarks fly into the door on the glass.
//
// Only transform, opacity and stroke-dashoffset animate, with two exceptions noted
// inline (the flight resizes boxes; the star is an SVG mask transform).
// Classic script; exposes window.TadaLoader.

(function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const el = (name, attrs = {}, parent) => { const n = document.createElementNS(NS, name); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const ART = TADA_ART, H = ART.hand, FA = ART.wordFa, EN = ART.wordEn;
  const T0 = H.line.t;                                    // the kit's centerline space → the mark's
  const P = (x, y) => ({ x: x + T0[0], y: y + T0[1] });
  // pivots of the snap, from the kit (same hand)
  const C = P(487.5, 404), K_MID = P(543, 496), K_THUMB = P(396.5, 671.5), K_WRIST = P(555, 890), K_RING = P(543, 496), K_PINKY = P(669, 509);
  const HW = H.vb[2], HH = H.vb[3];

  function box(d) {
    const n = d.match(/-?[\d.]+/g).map(Number); const xs = [], ys = [];
    for (let i = 0; i + 1 < n.length; i += 2) { xs.push(n[i]); ys.push(n[i + 1]); }

  /** The two wordmarks of the door, as the designer set them (fa over en), as strokes. */
  function buildWords({ cls = '' } = {}) {

    gsap.set(fx.smear, { svgOrigin: `${K_MID.x} ${K_MID.y}`, opacity: 0 });
    gsap.set(fx.burst, { opacity: 0 });
    gsap.set(hand.gThumb, { svgOrigin: `${K_THUMB.x} ${K_THUMB.y}` });
    gsap.set(hand.gRing, { svgOrigin: `${K_RING.x} ${K_RING.y}` });
    gsap.set(hand.gPinky, { svgOrigin: `${K_PINKY.x} ${K_PINKY.y}` });
    gsap.set(hand.root, { svgOrigin: `${K_WRIST.x} ${K_WRIST.y}` });

  /**

  function addSnap(tl, hand, fx, A, { stars = true } = {}) {

    tl.to(gThumb, { rotation: 2.5, duration: 0.28, ease: 'power2.in' }, A);
    tl.to(root, { rotation: -3, y: 7, duration: 0.28, ease: 'power2.in' }, A);

  /**

      const h = Math.max(120, Math.min(vh * 0.38, 360, room)), w = (h * HW) / HH;
      const top = (vh - (h + gap + wh)) / 2;
      Object.assign(wordEl.style, { left: `${(vw - ww) / 2}px`, top: `${top + h + gap}px`, width: `${ww}px`, height: `${wh}px` });
      const left = (vw - w) / 2;
      Object.assign(stage.style, { left: `${left}px`, top: `${top}px`, width: `${w}px`, height: `${h}px` });
      geo.k = h / HH; geo.left = left; geo.top = top;
      geo.sx = left + LOW.cx * geo.k; geo.sy = top + LOW.cy * geo.k;

    const tl = gsap.timeline({ paused: true, onComplete: finish });

      tl.add(land);

      // ---- 1. the hand, one unhurried pen, lifted only where a hand would lift it
      const order = [['thumb', 0.15, 0.24], ['thumbtop', 0.42, 0.2], ['middle_a', 0.64, 0.13], ['middle_b', 0.77, 0.24], ['outer', 1.05, 1.05], ['pinky', 2.14, 0.24], ['ring', 2.4, 0.28], ['midtip', 2.7, 0.2]];
      tl.add(() => play('introDraw'), 0.15);
      for (const [id, at, dur] of order) {
        const p = hand.pens[id], L = penLens[id], pr = { f: 0 };

        tl.to(pr, {

      // ---- 2. the wordmarks: تادا right to left, then TADA, paced by length
      let t = 3.05;
      const speed = 2600;   // units per second
      const wordPt = (p, len) => { const q = p.getPointAtLength(len), m = p.getScreenCTM(); return m ? { x: m.a * q.x + m.c * q.y + m.e, y: m.b * q.x + m.d * q.y + m.f } : null; };

        if (i === FA.p.length) t += 0.14;
        const L = wordLens[i], dur = Math.max(0.1, L / speed), pr = { f: 0 };
        tl.set(p, { opacity: 1 }, t);

      tl.add(() => hand.unmask(), t);
      // ---- 3. a breath, then the snap
      const snap = addSnap(tl, hand, fx, t + 0.3);
      tl.add(() => play('snap'), snap.R);

      const O = snap.S + 0.45;
      const low = hand.low;

      const Fl = O + 0.7;

        left: () => slots().words.left, top: () => slots().words.top, width: () => slots().words.width, height: () => slots().words.height,
        duration: 1.15, ease: 'power3.inOut', onComplete: land,

      tl.to(low, { opacity: 1, duration: 0.3, ease: 'none' }, Fl + 0.4);

      tl.to(skip, { opacity: 1, duration: 0.5 }, 0.5);
      skip.addEventListener('click', () => {
        if (finished || revealed) return;
        revealed = true; tl.pause(); tip(0, 0, false); play('ink', 0);
        gsap.to(root, { opacity: 0, duration: 0.4, ease: 'power2.out', onStart: () => opts.onReveal && opts.onReveal(), onComplete: () => { land(); finish(); } });

  }

  /** The loader plays once per browser session. */
  function shouldPlayLoader() {
    try { if (sessionStorage.getItem('tada.intro') === '1') return false; sessionStorage.setItem('tada.intro', '1'); return true; } catch { return true; }
  }

  window.TadaLoader = { buildHand, buildWords, addSnapHelpers, prepSnap, addSnap, playLoader, shouldPlayLoader, LOW, STARS, C, el };
})();

<script>
// TADA Lounge — the glass
// ----------------------
// The entrance and the snap of the previous site, with the mark as the designer drew it on
// the glass; the door; and one line with a glowing head that runs through the page. Every
// illustration of the glass is drawn by a pen, stroke after stroke, and then lives (leaves
// sway, steam rises, the scooter rides). The menu hangs on a shelf the line draws as the
// flavors pass; the branches sit beside a route; at the end the line draws the hand on
// the whole glass, and the hand snaps.
//
// Classic script; depends on gsap, ScrollTrigger, (Lenis), TADA_GLYPHS/TadaType,
// TADA_ART, TadaLoader, SITE, CONTENT, TadaSound.

(function () {
  'use strict';

  const SND = window.TadaSound, sfx = SND.sfx, TL = window.TadaLoader;
  const $ = (s, r = document) => r.querySelector(s);

  // the brand's four-point sparkle, exactly as on the glass (unit size, centred)
  const STAR_D = 'M0 -1C0.17 -0.54 0.52 -0.18 1 0C0.52 0.18 0.17 0.54 0 1C-0.17 0.54 -0.52 0.18 -1 0C-0.52 -0.18 -0.17 -0.54 0 -1Z';

  // the lozenge of the glass, as a pattern tile, in both lights
  {

  // ======================================================================
  // Language and content
  // ======================================================================
  let lang = 'fa';
  try { lang = localStorage.getItem('tada.lang') || 'fa'; } catch {}
  if (!CONTENT[lang]) lang = 'fa';
  const T = () => CONTENT[lang];

  let siteReady = false, quiet = false, started = false, parked = false;

  // ======================================================================
  // The art of the glass: drawn by one pen, then alive
  // ======================================================================
  const ART = TADA_ART;
  function artSvg(name) {
    const a = ART[name]; if (!a) return null;
    const svg = el('svg', { viewBox: a.vb.join(' '), class: 'art', 'aria-hidden': 'true', focusable: 'false' });
    const paths = [];

    svg.__art = { name, paths, strokes: paths.filter(p => p.classList.contains('s')), fills: paths.filter(p => p.classList.contains('f')), w: a.vb[2], drawn: false };

  }
  function inkPx() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--art-w')) || 2; }
  function fitArt(svg) {

  }
  const fitAll = () => $$('svg.art').forEach(fitArt);

  function prepDraw(svg) {
    const A = svg && svg.__art; if (!A || A.drawn || A.prepped) return;
    A.prepped = true;

  }

  // the pen's glowing tip, one per drawing in progress
  let inking = 0;
  function makeQuill() {
    const q = document.createElement('div');
    q.className = 'quill'; q.setAttribute('aria-hidden', 'true');
    q.innerHTML = `<svg viewBox="-12 -12 24 24"><circle r="11" class="q-glow"/><path class="q-star" d="${STAR_D}" transform="scale(4.4)"/><circle r="1.1" class="q-core"/></svg>`;
    document.body.appendChild(q);
    return q;
  }
  const ptOf = (p, len) => { const q = p.getPointAtLength(len), m = p.getScreenCTM(); return m ? { x: m.a * q.x + m.c * q.y + m.e, y: m.b * q.x + m.d * q.y + m.f, lx: q.x, ly: q.y } : null; };
  const isDark = n => { const s = n.closest && n.closest('[data-surface]'); return !s || s.dataset.surface === 'night'; };

  /**
   * The magic touches a piece: one pen draws it, stroke after stroke, lifting only between
   * strokes (always the nearest next), its tip glowing and shedding sparkles; filled shapes
   * are traced round, then filled. o.ordered keeps the given order (letters as written).
   */
  function drawArt(svg, o = {}) {
    const A = svg && svg.__art; if (!A || A.drawn) return;
    A.drawn = true;
    svg.classList.remove('is-waiting');
    const quick = o.instant || reduce || quiet || !A.prepped;
    if (quick) { alive(svg); return; }
    const m = svg.getScreenCTM(); const k = m ? Math.hypot(m.a, m.b) : 1;    // px per unit
    const items = A.paths.map(p => {
      const L = p.getTotalLength();
      return { p, L, fill: p.classList.contains('f') || p.classList.contains('tt-f'), a: p.getPointAtLength(0), b: p.getPointAtLength(L) };
    });
    let order = items;
    if (!o.ordered) {
      const vb = svg.viewBox.baseVal;
      let at = { x: RTL() ? vb.x + vb.width : vb.x, y: vb.y };
      const left = items.slice(); order = [];
      while (left.length) {
        let bi = 0, bd = Infinity, rev = false;
        left.forEach((it, i) => {
          const da = Math.hypot(it.a.x - at.x, it.a.y - at.y), db = it.fill ? Infinity : Math.hypot(it.b.x - at.x, it.b.y - at.y);
          if (da < bd) { bd = da; bi = i; rev = false; }
          if (db < bd) { bd = db; bi = i; rev = true; }
        });
        const it = left.splice(bi, 1)[0]; it.rev = rev; order.push(it);
        at = rev ? it.a : it.b;
      }
    }
    const totalPx = items.reduce((s, it) => s + it.L, 0) * k;
    const target = Math.max(1.1, Math.min(o.max || 3.4, totalPx / 700));
    const speed = Math.max(380, totalPx / target);                             // px per second
    const quill = makeQuill(); inking++;
    const dark = isDark(svg);
    const tl = gsap.timeline({ delay: o.delay || 0, onComplete: () => { quill.remove(); inking--; alive(svg); } });
    for (const it of items) {
      if (it.fill) { it.p.style.fillOpacity = 0; it.p.style.stroke = 'currentColor'; it.p.style.strokeWidth = (1.3 / k).toFixed(2); }
      it.p.style.strokeDasharray = `${it.L + 0.5} ${it.L + 2}`;
      it.p.style.strokeDashoffset = it.rev ? -(it.L + 0.5) : it.L + 0.5;
    }
    let t = 0, last = null;
    order.forEach(it => {
      const start = it.rev ? it.b : it.a;
      if (last) t += Math.min(0.14, Math.hypot(start.x - last.x, start.y - last.y) * k / 2600);
      const dur = Math.max(0.05, (it.L * k) / speed), pr = { f: 0 };
      tl.add(() => sound('pen'), t);
      tl.to(pr, {
        f: 1, duration: dur, ease: it.L * k > 140 ? 'power1.inOut' : 'none',
        onUpdate() {
          const d = it.L * pr.f;
          it.p.style.strokeDashoffset = it.rev ? -(it.L + 0.5 - d) : it.L + 0.5 - d;
          const s = ptOf(it.p, it.rev ? it.L - d : d);
          if (s) { quill.style.transform = `translate3d(${s.x.toFixed(1)}px, ${s.y.toFixed(1)}px, 0)`; quill.classList.toggle('on-dark', dark); if (Math.random() < 0.18) spawn(it.p, s.lx, s.ly, dark, 1, HUG); }
        },
      }, t);
      if (it.fill) tl.to(it.p.style, { fillOpacity: 1, duration: 0.35, ease: 'power1.out' }, t + dur * 0.7);
      t += dur;
      last = it.rev ? it.a : it.b;
    });
    tl.to(quill, { opacity: 0, duration: 0.3 }, t);
    tl.add(() => items.forEach(it => { it.p.style.strokeDasharray = ''; it.p.style.strokeDashoffset = ''; if (it.fill) { it.p.style.stroke = ''; it.p.style.strokeWidth = ''; it.p.style.fillOpacity = ''; } }), t);
  }

  // ---------- life: each piece of the glass breathes in its own way ----------
  // Indices are the pieces' paths as drawn by the designer (see _src/build_art.py).
  const LIFE = {
    palm: { sway: { idx: [0, 1, 2, 3, 4, 5, 6], at: [262, 266], amp: 2.4, dur: 2.6 } },
    leaf: { sway: { idx: 'all', at: [142, 172], amp: 3.5, dur: 3.2 } },
    scooter: { wind: [2, 5, 6], ride: [0, 1, 3, 4, 7, 8, 9, 10, 11] },
    kettle: { flow: [7] },
    espresso: { flow: [2, 8] },
    coffeeCup: { steam: [0, 1, 2] },
    cup: { steam: [0, 1, 2, 3, 4, 5] },
    hat: { sway: { idx: [0, 2], at: [24, 22], amp: 5, dur: 1.8 }, twinkle: [1, 3, 4] },
    glass: { twinkle: [3] }, glass2: { twinkle: [3] }, icedCup: { twinkle: [6] }, croissant: { twinkle: [1] },
    coffeePath: { flow: [8, 13, 11], bob: [[20, 21], [23, 24]] },
    sun: { shimmer: true },
    tagline: { twinkle: [1, 2, 13] },
    lozenge: { twinkleSmall: true },
    dotRow: { pulse: true },

  const living = new Map();   // svg → tweens, played only while on screen
  const lifeIO = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {

  function alive(svg) {
    const A = svg.__art; if (!A || reduce || living.has(svg)) return;
    const L = LIFE[A.name]; if (!L) return;
    const P = A.paths, tws = [];
    const pick = idx => (idx === 'all' ? P : idx.map(i => P[i]).filter(Boolean));
    const loop = v => { const t = gsap.to(v.t, { ...v.to, repeat: -1, yoyo: v.yoyo !== false, ease: v.ease || 'sine.inOut', paused: true }); tws.push(t); return t; };
    if (L.sway) pick(L.sway.idx).forEach((p, i) => {
      gsap.set(p, { svgOrigin: `${L.sway.at[0]} ${L.sway.at[1]}`, rotation: -L.sway.amp * 0.5 });
      loop({ t: p, to: { rotation: L.sway.amp * (0.7 + (i % 3) * 0.15), duration: L.sway.dur + (i % 4) * 0.22, delay: i * 0.09 } });
    });
    const flow = (p, dir = 1, seg = 0.16, gap = 0.1, dur) => {
      const len = p.getTotalLength(), per = len * (seg + gap);
      p.style.strokeDasharray = `${(len * seg).toFixed(1)} ${(len * gap).toFixed(1)}`;
      const t = gsap.fromTo(p, { strokeDashoffset: 0 }, { strokeDashoffset: -dir * per, duration: dur || Math.max(0.6, per / 90), ease: 'none', repeat: -1, paused: true });
      tws.push(t);
    };
    // a stream runs down: from its higher end to its lower one
    const downward = p => { const n = p.getTotalLength(), a = p.getPointAtLength(0), b = p.getPointAtLength(n); return a.y <= b.y ? 1 : -1; };
    if (L.flow) pick(L.flow).forEach(p => flow(p, downward(p), 0.2, 0.12));
    if (L.steam) pick(L.steam).forEach((p, i) => { flow(p, -downward(p), 0.3, 0.2, 2.4 + (i % 3) * 0.4); loop({ t: p, to: { opacity: 0.45, duration: 1.6 + (i % 3) * 0.3, delay: i * 0.2 } }); });
    if (L.wind) pick(L.wind).forEach((p, i) => {
      // the air streams back from the scooter
      const n = p.getTotalLength(), a = p.getPointAtLength(0), b = p.getPointAtLength(n);

      loop({ t: p, to: { opacity: 0.35, duration: 0.3 + i * 0.07 } });
    });
    if (L.ride) loop({ t: pick(L.ride), to: { y: -5, duration: 0.32 } });
    if (L.twinkle) pick(L.twinkle).forEach((p, i) => { gsap.set(p, { transformOrigin: '50% 50%' }); loop({ t: p, to: { scale: 1.14, rotation: 8, duration: 1.3 + i * 0.27, delay: i * 0.4 } }); });
    if (L.bob) L.bob.forEach((ids, i) => loop({ t: ids.map(n => P[n]).filter(Boolean), to: { y: -7, duration: 1.4 + i * 0.3, delay: i * 0.5 } }));
    if (L.shimmer) {
      // a light runs round the sun's crown of ticks; its rays breathe
      const ticks = P.filter(p => { const b = p.getBBox(); return b.width < 30 && b.height < 30 && b.y < 380; });
      const rays = P.filter(p => { const b = p.getBBox(); return b.y > 400 && b.width < 120 && b.height < 140; });
      ticks.sort((a, b) => a.getBBox().x - b.getBBox().x);
      const tl = gsap.timeline({ repeat: -1, paused: true });
      ticks.forEach((p, i) => tl.to(p, { opacity: 0.25, duration: 0.25, yoyo: true, repeat: 1, ease: 'sine.inOut' }, i * 0.06));
      tl.to({}, { duration: 1.2 });
      tws.push(tl);
      rays.forEach((p, i) => loop({ t: p, to: { opacity: 0.4, duration: 1.8, delay: i * 0.15 } }));
    }

    if (L.pulse) P.forEach((p, i) => { gsap.set(p, { transformOrigin: '50% 50%' }); loop({ t: p, to: { scale: 0.7, opacity: 0.6, duration: 1.1, delay: i * 0.12 } }); });
    living.set(svg, tws);
    if (lifeIO) lifeIO.observe(svg); else tws.forEach(t => t.play());
  }

  // ---------- Tada letters ----------
  const headSize = () => (small() ? 30 : narrow() ? 44 : 56);
  function letters(text, size, cls) {

      h.append(sr, letters(text, headSize()));

  // ---------- the glass's chamfered panel ----------
  const frameRO = 'ResizeObserver' in window ? new ResizeObserver(es => es.forEach(e => paintFrame(e.target))) : null;
  function frameIt(node, cut) {
    let svg = $(':scope > .frame', node);

  function paintFrame(node) {
    const svg = $(':scope > .frame', node); if (!svg) return;
    const w = node.offsetWidth, h = node.offsetHeight; if (!w || !h) return;
    const c = Math.min(node.__cut, h / 2.6, w / 4);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    $$('.fr-base, .fr-on', svg).forEach(p => p.setAttribute('d', octagon(w, h, c)));
    // the four magic triangles that complete the frame (cards)
    const pts = [[[0, 0], [c, 0], [0, c]], [[w, 0], [w - c, 0], [w, c]], [[w, h], [w - c, h], [w, h - c]], [[0, h], [c, h], [0, h - c]]];
    $$('.fr-tri', svg).forEach((p, i) => { p.setAttribute('d', `M${pts[i].map(q => q.join(' ')).join('L')}Z`); p.dataset.ox = pts[i][0][0]; p.dataset.oy = pts[i][0][1]; });
  }
  function frameAll() { $$('.btn:not(.btn-quiet)').forEach(b => frameIt(b, 12)); }

  // ---------- opening hours, in Tehran ----------
  function tehranNow() {
    try {
      const parts = new Intl.DateTimeFormat('en-GB', { timeZone: SITE.timeZone, hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date());
      return (+parts.find(p => p.type === 'hour').value % 24) + (+parts.find(p => p.type === 'minute').value) / 60;
    } catch { const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
  }
  function paintStatus() {
    const s = $('#openStatus'); if (!s) return;
    const t = tehranNow(), H = SITE.hours, S = T().status;
    let text, open = false;
    const now = H.find(([a, b]) => t >= a && t < b);
    if (now) { open = true; text = S.open(num(now[1])); }
    else if (t < H[0][0]) text = S.today(num(H[0][0]));
    else { const next = H.find(([a]) => t < a); text = next ? S.gap(num(next[0])) : S.tomorrow(num(H[0][0])); }
    s.textContent = text; s.classList.toggle('is-open', open);
  }
  setInterval(paintStatus, 60000);

  // ---------- content pieces ----------
  function buildPack() {
    const P = T().bar.pack, box = $('#pack');

  // ======================================================================
  // The door: the arch, and the mark that lands in it
  // ======================================================================

    $$('.tt-h').forEach(h => { const s = $('svg.tt', h); if (drawn.has(h.dataset.tt)) { h.__drawn = true; if (s) drawArt(s, { instant: true }); } else if (s) prepDraw(s); });
    $$('#menuTrack svg.art, #menuTrack svg.tt, #branchRows svg.art').forEach(s => prepDraw(s));
    if (wasOpen) closeMenu();
    await document.fonts.ready;
    rebuild();
  }));
  if ('ResizeObserver' in window) {
    const seen = new Map();
    const ro = new ResizeObserver(entries => {
      let moved = false;
      for (const en of entries) {
        const w = Math.round(en.contentRect.width), h = Math.round(en.contentRect.height), k = seen.get(en.target);
        if (k && (Math.abs(k[0] - w) > 1 || Math.abs(k[1] - h) > 1)) moved = true;
        seen.set(en.target, [w, h]);
      }
      if (moved && started) { clearTimeout(rz); rz = setTimeout(rebuild, 260); }
    });
    ['#morning .container', '#bar .container', '#menu .menu-head', '#evening .container', '#branches .container', '#order .container', '#collab .container', '#muralFrame'].forEach(s => { const n = $(s); if (n) ro.observe(n); });
  }
  let rz, lastW = innerWidth;
  addEventListener('resize', () => {
    sizeDust(); fitAll();
    if (Math.abs(innerWidth - lastW) < 2 && !fine) return;
    lastW = innerWidth;
    clearTimeout(rz); rz = setTimeout(rebuild, 220);
  });
})();

</script>
